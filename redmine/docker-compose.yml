version: "3.8"

services:
  redmine:
    image: redmine:7.0.2
    container_name: redmine-app
    ports:
      - "8888:3000"
    environment:
      REDMINE_DB_MYSQL: db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: Wbc@redmine@123
      REDMINE_DB_DATABASE: redmine
    volumes:
      - redmine_files:/usr/src/redmine/files
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: redmine-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Wbc@redmine@root@123
      MYSQL_DATABASE: redmine
      MYSQL_USER: redmine
      MYSQL_PASSWORD: Wbc@redmine@123
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./redminedb-20260610.sql:/tmp/import.sql

volumes:
  redmine_files:
  mysql_data:
