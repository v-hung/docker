version: "3.8"

services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: Admin@123
      MYSQL_DATABASE: mydb
      UPLOAD_LIMIT: 100M
    ports:
      - "3306:3306"
    volumes:
      - mysql5_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: Admin@123
      UPLOAD_LIMIT: 100M
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  mysql5_data:
