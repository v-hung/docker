version: "3.8"

services:
  mysql:
    image: mysql:5.7.29
    container_name: mysql_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Wbc@ecs@root@123
      MYSQL_DATABASE: ecs
      MYSQL_USER: ecs
      MYSQL_PASSWORD: Wbc@ecs@123
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ecs-20260610.sql:/tmp/import.sql
    networks:
      - app-net

  rabbitmq:
    image: rabbitmq:3.7.24-management
    container_name: rabbitmq_server
    restart: always
    # ports:
    #   - "5672:5672"
    #   - "15672:15672"
    networks:
      - app-net

  tomcat:
    build: .
    container_name: tomcat_server
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/usr/local/tomcat/logs
    depends_on:
      - mysql
      - rabbitmq
    networks:
      - app-net

volumes:
  mysql_data:

networks:
  app-net:
    driver: bridge
